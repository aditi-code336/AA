<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Heart Disease Risk Predictor</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1f2937, #7f1d1d);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            padding: 40px 0;
        }
        .card {
            max-width: 800px;
            margin: 0 auto;
            border-radius: 16px;
            border: none;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .card-header {
            background: #b91c1c;
            color: white;
            border-radius: 16px 16px 0 0 !important;
            text-align: center;
            padding: 25px;
        }
        .card-header h2 { margin: 0; font-weight: 700; }
        .card-header p { margin: 5px 0 0; opacity: 0.85; }
        .form-label { font-weight: 600; color: #374151; }
        .btn-predict {
            background: #b91c1c;
            border: none;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
        }
        .btn-predict:hover { background: #991b1b; }
        .result-box {
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
            font-size: 1.2em;
            font-weight: 600;
        }
        .high-risk { background: #fee2e2; color: #991b1b; border: 2px solid #f87171; }
        .low-risk { background: #dcfce7; color: #166534; border: 2px solid #4ade80; }
    </style>
</head>
<body>
<div class="card">
    <div class="card-header">
        <h2>&#10084; Heart Disease Risk Predictor</h2>
        <p>Logistic Regression model — enter patient details below</p>
    </div>
    <div class="card-body p-4">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Age</label>
                    <input type="number" step="1" class="form-control" name="age" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Sex</label>
                    <select class="form-select" name="sex" required>
                        <option value="1">Male</option>
                        <option value="0">Female</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Chest Pain Type (cp)</label>
                    <select class="form-select" name="cp" required>
                        <option value="0">0 - Typical angina</option>
                        <option value="1">1 - Atypical angina</option>
                        <option value="2">2 - Non-anginal pain</option>
                        <option value="3">3 - Asymptomatic</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Resting BP (trestbps)</label>
                    <input type="number" step="1" class="form-control" name="trestbps" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Cholesterol (chol)</label>
                    <input type="number" step="1" class="form-control" name="chol" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Fasting Blood Sugar &gt; 120 (fbs)</label>
                    <select class="form-select" name="fbs" required>
                        <option value="1">Yes</option>
                        <option value="0">No</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Resting ECG (restecg)</label>
                    <select class="form-select" name="restecg" required>
                        <option value="0">0 - Normal</option>
                        <option value="1">1 - ST-T abnormality</option>
                        <option value="2">2 - LV hypertrophy</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Max Heart Rate (thalach)</label>
                    <input type="number" step="1" class="form-control" name="thalach" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Exercise-Induced Angina (exang)</label>
                    <select class="form-select" name="exang" required>
                        <option value="1">Yes</option>
                        <option value="0">No</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">ST Depression (oldpeak)</label>
                    <input type="number" step="0.1" class="form-control" name="oldpeak" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Slope of ST Segment (slope)</label>
                    <select class="form-select" name="slope" required>
                        <option value="0">0 - Upsloping</option>
                        <option value="1">1 - Flat</option>
                        <option value="2">2 - Downsloping</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Major Vessels Colored (ca)</label>
                    <select class="form-select" name="ca" required>
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Thalassemia (thal)</label>
                    <select class="form-select" name="thal" required>
                        <option value="0">0</option>
                        <option value="1">1 - Fixed defect</option>
                        <option value="2">2 - Normal</option>
                        <option value="3">3 - Reversible defect</option>
                    </select>
                </div>
            </div>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-predict text-white btn-lg">Predict Risk</button>
            </div>
        </form>

        {% if prediction %}
            <div class="result-box {{ 'high-risk' if 'High' in prediction else 'low-risk' }}">
                {{ prediction }}
                {% if probability %}
                    <br><small>Model confidence: {{ probability }}%</small>
                {% endif %}
            </div>
        {% endif %}

        {% if error %}
            <div class="result-box high-risk">{{ error }}</div>
        {% endif %}
    </div>
</div>
</body>
</html>
